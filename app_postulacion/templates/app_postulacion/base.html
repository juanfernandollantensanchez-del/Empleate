<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Empléate</title>
</head>
<body>

    <header>
        <h1>Empléate App</h1>
        <nav>
            <a href="{% url 'home' %}">Inicio</a>
            <a href="{% url 'lista_ofertas' %}">Ofertas de Empleo</a>
            <a href="{% url 'historial_postulaciones' %}">Mis Postulaciones</a>
            <a href="/admin/" target="_blank">Panel Admin</a>
        </nav>
    </header>

    <div>
        {% if messages %}
            {% for message in messages %}
                <div>
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
