{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Empleate</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="postulacion-base-page">

    <header class="site-header">
        <h1>Empleate App</h1>
        <nav class="nav-links">
            <a href="{% url 'home' %}">Inicio</a>
            <a href="{% url 'lista_ofertas' %}">Ofertas de Empleo</a>
            <a href="{% url 'historial_postulaciones' %}">Mis Postulaciones</a>
            <a href="/admin/" target="_blank">Panel Admin</a>
        </nav>
    </header>

    <div class="container app-container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
