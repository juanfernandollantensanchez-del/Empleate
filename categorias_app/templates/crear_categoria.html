{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Categoría</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="categoria-form-page">
    <div class="form-container categoria-box">
        <h2>Nueva Categoría</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group"><label>Nombre:</label>{{ form.nombre }}</div>
            <div class="form-group"><label>Tipo:</label>{{ form.tipo_categoria }}</div>
            <div class="form-group"><label>Descripción:</label>{{ form.descripcion }}</div>
            <div class="form-group"><label>{{ form.estado }} Activa</label></div>
            <button type="submit" class="btn btn-primary btn-submit">Guardar Categoría</button>
        </form>
    </div>
</body>
</html>
