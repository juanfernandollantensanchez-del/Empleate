{% load static %}
{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Diagnóstico y Feedback</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="empleate-feedback-page">
    <div class="container py-5 app-container">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div class="card card-custom form-container feedback-box p-5">
                    <h2 class="text-center fw-bold mb-2">Módulo de Diagnóstico y Feedback</h2>
                    <p class="text-center mb-4">Registro oficial de retroalimentación, test inicial y recomendaciones de entrenamiento.</p>
                    <hr class="mb-4">
                    
                    <form method="post">
                        {% csrf_token %}
                        {% crispy form %}
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
