<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar vacante - EMPLÉATE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-custom { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header-section { background: linear-gradient(135deg, #ffc107, #fd7e14); color: white; border-radius: 12px; }
    </style>
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <!-- Encabezado -->
                <div class="header-section p-4 mb-4 text-center shadow-sm">
                    <h1 class="fw-bold m-0">✏️ Editar vacante</h1>
                    <p class="mb-0 mt-2 text-white-50">Modifica la información necesaria de la oferta laboral</p>
                </div>

                <!-- Formulario -->
                <div class="card card-custom p-4 p-md-5 bg-white">
                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Cargo:</label>
                            <input 
                                type="text" 
                                name="cargo" 
                                class="form-control" 
                                value="{{ vacante.cargo }}" 
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Categoría:</label>
                            <input 
                                type="text" 
                                name="categoria" 
                                class="form-control" 
                                value="{{ vacante.categoria }}" 
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Descripción:</label>
                            <textarea 
                                name="descripcion" 
                                class="form-control" 
                                rows="4"
                            >{{ vacante.descripcion }}</textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Salario:</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input 
                                        type="number" 
                                        name="salario" 
                                        step="0.01" 
                                        class="form-control" 
                                        value="{{ vacante.salario }}" 
                                        required
                                    >
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Empresa:</label>
                                <input 
                                    type="text" 
                                    name="empresa" 
                                    class="form-control" 
                                    value="{{ vacante.empresa }}" 
                                    required
                                >
                            </div>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-warning text-dark py-2.5 rounded-pill fw-bold fs-6">
                                Guardar cambios
                            </button>
                        </div>

                    </form>
                </div>

                <!-- Botón Cancelar -->
                <div class="mt-4 text-center">
                    <a href="{% url 'inicio' %}" class="btn btn-outline-secondary px-4 py-2 rounded-pill">
                        Cancelar
                    </a>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
