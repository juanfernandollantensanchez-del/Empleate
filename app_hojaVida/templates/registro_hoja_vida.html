
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar hoja de vida</title>
</head>

<body>

    <div class="contenedor">

        <div class="encabezado">

            <h1>📄 Registrar hoja de vida</h1>

            <p>
                Completa tu información para comenzar
                a buscar oportunidades laborales
            </p>

        </div>

        <form class="formulario"
              method="POST"
              enctype="multipart/form-data">

            {% csrf_token %}

            <!-- NOMBRE E IDENTIFICACIÓN -->

            <div class="fila">

                <div class="campo">

                    <label>👤 Nombre completo</label>

                    <input
                        type="text"
                        name="nombre_completo"
                        placeholder="Ingresa tu nombre completo"
                        required>

                </div>

                <div class="campo">

                    <label>🪪 Número de identificación</label>

                    <input
                        type="text"
                        name="identificacion"
                        placeholder="Ingresa tu número de identificación"
                        required>

                </div>

            </div>

            <div class="fila">

                <div class="campo">

                    <label>📍 Dirección</label>

                    <input
                        type="text"
                        name="direccion"
                        placeholder="Ingresa tu dirección"
                        required>

                </div>

                <div class="campo">

                    <label>🎓 Educación</label>

                    <textarea
                        name="educacion"
                        placeholder="Describe tus estudios"
                        required></textarea>

                </div>

            </div>

            <div class="fila">

                <div class="campo">

                    <label>📄 Soporte de educación</label>

                    <input
                        type="file"
                        name="soporte_educacion"
                        accept=".pdf,application/pdf"
                        required>

                    <span class="info-pdf">
                        Solo se permiten archivos PDF.
                    </span>

                </div>

                <div class="campo">

                    <label>💼 Experiencia laboral</label>

                    <textarea
                        name="experiencia_laboral"
                        placeholder="Describe tu experiencia laboral"
                        required></textarea>

                </div>

            </div>

            <div class="fila">

                <div class="campo">

                    <label>📄 Soporte de experiencia laboral</label>

                    <input
                        type="file"
                        name="soporte_experiencia"
                        accept=".pdf,application/pdf"
                        required>

                    <span class="info-pdf">
                        Solo se permiten archivos PDF.
                    </span>

                </div>

                <div class="campo">

                    <label>🌎 Idiomas</label>

                    <input
                        type="text"
                        name="idiomas"
                        placeholder="Ejemplo: Español, Inglés"
                        required>

                </div>

            </div>

            <div class="fila">

                <div class="campo">

                    <label>⚖️ Antecedentes penales</label>

                    <textarea
                        name="antecedentes_penales"
                        placeholder="Ingresa la información correspondiente"
                        required></textarea>

                </div>

                <div class="campo">

                    <label>⭐ Habilidades</label>

                    <textarea
                        name="habilidades"
                        placeholder="Ejemplo: Trabajo en equipo, liderazgo..."
                        required></textarea>

                </div>

            </div>

            <div class="boton">

                <button type="submit">
                    Registrar hoja de vida
                </button>

            </div>

        </form>

    </div>

</body>

</html>
