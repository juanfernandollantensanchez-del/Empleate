{% extends 'usuarios/base.html' %}

{% block title %}Registro - Empleate{% endblock %}

{% block content %}
<div class="card">
    <h2>Registro de Nuevo Usuario</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Completar Registro</button>
    </form>
    <p class="auth-footer-link">
        ¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión aquí</a>
    </p>
</div>
{% endblock %}
