{% extends 'usuarios/base.html' %}

{% block title %}Cambiar Contraseña - Empleate{% endblock %}

{% block content %}
<div class="card auth-card">
    <h2>Cambiar mi Contraseña</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Actualizar Contraseña</button>
    </form>
</div>
{% endblock %}
