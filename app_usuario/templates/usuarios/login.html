{% extends 'usuarios/base.html' %}

{% block title %}Iniciar Sesión - Empleate{% endblock %}

{% block content %}
<div class="card auth-card auth-card-sm">
    <h2>Iniciar Sesión</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Ingresar</button>
    </form>
    <p class="auth-footer-link">
        ¿No tienes cuenta? <a href="{% url 'registro_usuario' %}">Regístrate aquí</a>
    </p>
</div>
{% endblock %}
